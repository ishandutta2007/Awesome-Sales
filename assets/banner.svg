<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="auto">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Revenue Curve Gradient -->
    <linearGradient id="curve-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-high" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pulsing-glow {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    .orbit-pulse {
      animation: orbitPulse 3s ease-in-out infinite;
    }
    .shimmer-text {
      animation: textShimmer 6s linear infinite;
    }
    .path-flow {
      stroke-dasharray: 12, 12;
      animation: dashFlow 20s linear infinite;
    }
    .node-blink-1 { animation: blink 2.5s ease-in-out infinite 0s; }
    .node-blink-2 { animation: blink 2.5s ease-in-out infinite 0.6s; }
    .node-blink-3 { animation: blink 2.5s ease-in-out infinite 1.2s; }
    .node-blink-4 { animation: blink 2.5s ease-in-out infinite 1.8s; }

    @keyframes pulseGlow {
      0% { opacity: 0.35; transform: scale(1); }
      100% { opacity: 0.75; transform: scale(1.08); }
    }
    @keyframes textShimmer {
      0% { stop-color: #38bdf8; }
      33% { stop-color: #818cf8; }
      66% { stop-color: #c084fc; }
      100% { stop-color: #38bdf8; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes blink {
      0%, 100% { r: 6; opacity: 0.8; }
      50% { r: 10; opacity: 1; filter: drop-shadow(0 0 8px #34d399); }
    }
  </style>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg-grad)"/>

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="100" r="180" fill="#38bdf8" opacity="0.12" filter="url(#glow-high)" class="pulsing-glow"/>
  <circle cx="1080" cy="300" r="220" fill="#818cf8" opacity="0.10" filter="url(#glow-high)" class="pulsing-glow"/>
  <circle cx="700" cy="200" r="150" fill="#34d399" opacity="0.08" filter="url(#glow-high)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="960" y1="0" x2="960" y2="400"/>
    <line x1="1120" y1="0" x2="1120" y2="400"/>
  </g>

  <!-- Sales Deal Growth Curve Line -->
  <path d="M 50 340 Q 300 320, 500 280 T 800 180 T 1050 110 T 1230 60" fill="none" stroke="url(#curve-grad)" stroke-width="3.5" filter="url(#glow)" class="path-flow"/>
  <!-- Underlying glow path -->
  <path d="M 50 340 Q 300 320, 500 280 T 800 180 T 1050 110 T 1230 60" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>

  <!-- Pipeline Stage Nodes -->
  <!-- Lead -->
  <circle cx="500" cy="280" r="7" fill="#38bdf8" class="node-blink-1"/>
  <text x="500" y="308" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">1. LEAD</text>

  <!-- Qualified -->
  <circle cx="800" cy="180" r="7" fill="#818cf8" class="node-blink-2"/>
  <text x="800" y="208" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">2. QUALIFIED</text>

  <!-- Deal -->
  <circle cx="1050" cy="110" r="7" fill="#c084fc" class="node-blink-3"/>
  <text x="1050" y="138" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">3. PROPOSAL</text>

  <!-- Won -->
  <circle cx="1230" cy="60" r="8" fill="#34d399" class="node-blink-4"/>
  <text x="1225" y="40" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" text-anchor="middle">WON &#10004;</text>

  <!-- Badge: Curated Sales Tech Stack -->
  <g transform="translate(100, 75)">
    <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
    <circle cx="18" cy="15" r="5" fill="#34d399"/>
    <text x="32" y="20" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" letter-spacing="0.8">AWESOME SALES STACK</text>
  </g>

  <!-- Title -->
  <text x="100" y="165" fill="url(#brand-grad)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="52" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
    Awesome Sales
  </text>

  <!-- Subtitle -->
  <text x="102" y="215" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="700">
    CRM, Sales Automation, Pipeline Management &amp; RevOps
  </text>

  <!-- Description tags -->
  <text x="102" y="255" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="400">
    Open-Source Self-Hosted Platforms &amp; Commercial SaaS Reference Architecture
  </text>

  <!-- Tech tags pills -->
  <g transform="translate(100, 290)">
    <!-- Tag 1: Open Source -->
    <rect x="0" y="0" width="125" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="62" y="18" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">&#9889; 50+ OS CRMs</text>

    <!-- Tag 2: SaaS Market -->
    <rect x="135" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="202" y="18" fill="#818cf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">&#128202; 32 SaaS Giants</text>

    <!-- Tag 3: Pricing & Limits -->
    <rect x="280" y="0" width="140" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="350" y="18" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">&#128176; Pricing &amp; Trials</text>

    <!-- Tag 4: Revenue Ops -->
    <rect x="430" y="0" width="115" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="487" y="18" fill="#c084fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">&#128640; RevOps Stacks</text>
  </g>
</svg>
